// Binary heap for an event-driven simulation. No 1-second loops: cost scales with event count.

 function updateQueue(nid){const st=stats[nid];if(!st)return;const total=(arriving[nid]||[]).reduce((a,e)=>a+e.ready.length,0);st.maxQueue=Math.max(st.maxQueue,total);}

function kpi(label,value,sub,symbol='grid',theme=''){return `<article class="card kpi-card"><div class="kpi-top"><span>${label}</span><span class="metric-symbol ${theme}">${icon(symbol)}</span></div><div class="kpi-value">${value}</div><div class="metric-trend">${sub}</div></article>`;}
function plotSvg(current,base){const W=820,H=256,pad={l:38,r:24,t:21,b:34},maxT=Math.max(current?.horizon||1200,base?.horizon||1200),maxY=Math.max(current?.target||10,base?.target||10,1),X=t=>pad.l+t/maxT*(W-pad.l-pad.r),Y=v=>H-pad.b-v/maxY*(H-pad.t-pad.b);function line(r){if(!r||!r.series.length)return'';return r.series.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)} ${Y(p.value).toFixed(1)}`).join(' ');}const ticks=Array.from({length:5},(_,i)=>i);return `<svg class="mini-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График накопленного выпуска, базовый и текущий сценарии"><defs><linearGradient id="gradientChart" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#756af5" stop-opacity=".13"/><stop offset="1" stop-color="#756af5" stop-opacity="0"/></linearGradient></defs>${ticks.map(i=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(i*maxY/4)}" y2="${Y(i*maxY/4)}" stroke="#e8ecf4" stroke-dasharray="3 5"/><text x="${pad.l-10}" y="${Y(i*maxY/4)+4}" text-anchor="end" fill="#929fb2" font-size="12">${fix(i*maxY/4)}</text>`).join('')}${ticks.map(i=>`<text x="${X(i*maxT/4)}" y="${H-10}" text-anchor="middle" fill="#929fb2" font-size="12">${fmt(i*maxT/240)} мин</text>`).join('')}<path d="${line(base)}" fill="none" stroke="#14aa9a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="${line(current)}" fill="none" stroke="#6558ec" stroke-width="3.7" stroke-linejoin="round"/>${current?.series?.length?`<circle cx="${X(current.series[current.series.length-1].t)}" cy="${Y(current.accepted)}" r="5.5" fill="#6558ec" stroke="#fff" stroke-width="2"/>`:''}</svg>`;}
function opBars(r,limit=10){return r.perOp.slice(0,limit).map(o=>`<div class="op-line"><span class="op-name" title="${esc(o.name)}">${esc(o.name)}</span><div class="bar-track"><div class="bar-fill ${o.utilization>=85?'warn':''}" style="width:${Math.max(.4,Math.min(100,o.utilization))}%"></div></div><span class="op-value">${fix(o.utilization)}%</span></div>`).join('');}
function issueCards(r,limit=4){return r.issues.slice(0,limit).map(it=>`<div class="issue"><div class="issue-icon ${it.type==='critical'?'critical':''}">${icon(it.type==='ok'?'check':'alert')}</div><div><b>${esc(it.title)}</b><p>${esc(it.detail)}</p></div></div>`).join('');}
function delta(value,base,preferHigh=true,suffix='',dec=0){if(value===null||base===null||value===undefined||base===undefined)return '—';const d=value-base;if(Math.abs(d)<.0001)return '<span class="muted">без изменений</span>';const positive=(d>0)===preferHigh;return `<span class="delta ${positive?'positive':'negative'}">${d>0?'+':''}${fix(d,dec)}${suffix}</span>`;}
function overview(){const r=state.result,b=state.baselineResult,s=state.model.settings;return `${headline('ОПЕРАЦИОННАЯ АНАЛИТИКА','Панель производства','Единый обзор производительности фабрики процессов. Все показатели рассчитываются по текущему сценарию, а не берутся из реального MES.',btn(icon('flow')+'Открыть карту','goto-map','soft'))}${changesWarn()}<div class="grid kpi-grid">
${kpi('Принято заказчиком',`${r.accepted} <span style="font-size:15px;color:#9aa3b8;font-weight:650">/ ${r.target}</span>`,`План: ${fmt(s.target)} изделий · ${delta(r.accepted,b.accepted,true,' шт.')}`,'check','teal')}
${kpi('Время в потоке',r.avgFlowSec===null?'—':`${fix(r.avgFlowSec/60)} мин`,r.avgFlowSec===null?'Нет принятой продукции':`Целевое ВПП ≤ 10 мин`,'flow','')}
${kpi('Незавершённое производство',`${r.wip} ед.`,`В начале смены: ${r.initialWipCount} ед. начального НЗП`,'copy','orange')}
${kpi('Финансовый результат',rub(r.financial.profit),`${r.financial.profit<0?'Убыток':'Прибыль'} · демонстрационный расчёт`,'wallet',r.financial.profit<0?'red':'teal')}</div>
<div class="grid overview-grid"><div class="grid" style="gap:17px"><section class="card"><div class="section-head"><div><h2 class="card-title">Исполнение производственного плана</h2><div class="card-sub">Накопленное количество принятых изделий по времени</div></div><div class="legend"><span><i></i>Текущий</span><span><i class="teal"></i>Базовый</span></div></div>${plotSvg(r,b)}</section><section class="card"><div class="section-head"><div><h2 class="card-title">Показатели производственной модели</h2><div class="card-sub">Расчёт по заданным параметрам и ограниченным ресурсам</div></div>${btn('Подробнее','goto-simulation','sm soft')}</div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:13px"><div class="stat-panel"><div class="tiny muted">Выпуск, шт/ч</div><div class="value">${fix(r.throughputPerHour,1)}</div></div><div class="stat-panel"><div class="tiny muted">Рейсов логиста</div><div class="value">${r.logistics.trips}</div></div><div class="stat-panel"><div class="tiny muted">Брак, ед.</div><div class="value">${r.totalScrap}</div></div></div></section></div><div class="overview-right"><section class="card"><div class="section-head"><div><h2 class="card-title">Загрузка рабочих мест</h2><div class="card-sub">Доля занятого времени, %</div></div></div>${opBars(r)}</section><section class="card"><div class="section-head"><h2 class="card-title">Диагностика потерь</h2><span class="pill amber">${r.issues.length} сигналов</span></div>${issueCards(r,4)}<div style="margin-top:15px">${btn('Все рекомендации','goto-insights','soft sm')}</div></section></div></div><div class="footer">Учебная математическая модель; показатели не являются подтверждёнными производственными замерами. Метод: дискретно-событийная симуляция с фиксированным генератором случайных чисел.</div>`;}
function edgeKey(e){return e.from+'>'+e.to;}
function edgePath(a,b){const ac=nodeCenter(a),bc=nodeCenter(b);let x1=a.x+nodeWidth(a),y1=ac.y,x2=b.x,y2=bc.y;let dist=x2-x1;let c=dist>=25?Math.max(34,dist*.5):Math.max(60,Math.abs(dist)*.45);return `M${x1} ${y1} C${x1+c} ${y1},${x2-c} ${y2},${x2} ${y2}`;}
function renderEdges(){return state.model.edges.map(e=>{const a=nodeOf(state.model,e.from),b=nodeOf(state.model,e.to),selected=state.edgeSelected===edgeKey(e),p=edgePath(a,b);return `<path class="edge-path ${selected?'focus':''}" d="${p}"/><path class="edge-hit" d="${p}" data-edge="${esc(edgeKey(e))}"/>`;}).join('');}
function graphNode(n){const sel=state.selected===n.id,st=state.result?.perOp.find(x=>x.id===n.id),isSpecial=n.type==='warehouse'||n.type==='customer';return `<div class="graph-node ${isSpecial?'special':''} ${n.type==='qc'?'qc':''} ${sel?'selected':''} ${state.linkFrom===n.id?'connect-first':''}" data-node="${esc(n.id)}" style="left:${n.x}px;top:${n.y}px" tabindex="0" role="button" aria-label="${esc(n.name)}, выбрать или перетащить"><div class="node-head"><span class="node-number">${n.type==='warehouse'?'СКЛ':n.type==='customer'?'КЛИ':n.type==='qc'?'ОТК':n.id.replace(/^o/,'ОП-')}</span><span>${n.type==='warehouse'?'Поставщик':n.type==='customer'?'Получатель':'Рабочее место'}</span></div><div class="node-name">${esc(n.name)}</div><div class="node-stats"><span>${st?`Цикл <b>${fix(n.cycle)} с</b>`:isSpecial?'Материальный поток':'—'}</span><span>${st?`Загрузка <b>${fix(st.utilization)}%</b>`:''}</span></div>${st&&st.utilization>=85?'<div class="node-alert" title="Высокая загрузка">!</div>':''}</div>`;}
function edgeInspector(e){const a=nodeOf(state.model,e.from),b=nodeOf(state.model,e.to);const s=state.model.settings,d=Math.hypot(nodeCenter(a).x-nodeCenter(b).x,nodeCenter(a).y-nodeCenter(b).y)*s.metersPerPixel;return `<section class="card inspector"><div class="inspect-head"><div class="inspect-marker">${icon('flow')}</div><div><div class="eyebrow" style="margin:0 0 3px">МАТЕРИАЛЬНЫЙ ПОТОК</div><div style="font-weight:800">Параметры связи</div></div></div><div class="report-line"><span>Источник</span><b>${esc(a.name)}</b></div><div class="report-line"><span>Получатель</span><b>${esc(b.name)}</b></div><div class="report-line"><span>Условная дистанция</span><b>${fix(d,2)} м</b></div><div class="report-line"><span>Передача партии</span><b>${s.transportBatch} ед.</b></div><div class="notice" style="margin-top:15px">${icon('alert')}Позиции на карте условные. Фактические расстояния и маршруты логиста необходимо измерить.</div><div style="margin-top:16px">${btn('Удалить связь','delete-edge','danger','data-edge-key="'+esc(edgeKey(e))+'"')}</div></section>`;}
function nodeInspector(n){const isOp=n.type==='operation'||n.type==='qc';const inLinks=incoming(state.model,n.id),outLinks=outgoing(state.model,n.id);return `<section class="card inspector"><div class="inspect-head"><div class="inspect-marker">${icon(n.type==='warehouse'?'store':n.type==='customer'?'check':'gear')}</div><div><div class="eyebrow" style="margin:0 0 3px">ИНСПЕКТОР ОБЪЕКТА</div><div style="font-size:12px;color:#8592a6">${esc(n.id.toUpperCase())} · ${n.type==='qc'?'ОТК':isOp?'Операция':n.type==='warehouse'?'Склад':'Заказчик'}</div></div></div><h3 class="inspect-title">${esc(n.name)}</h3><div class="form-grid"><div class="field full"><label>Название объекта</label><input data-scope="node" data-key="name" value="${esc(n.name)}" maxlength="80" aria-label="Название выбранного объекта"></div>${isOp?`${input('Время цикла, сек','cycle',n.cycle,1,3600,1,'','node')}${input('Операторы','staff',n.staff,1,8,1,'','node')}${input('Колебания, %','variation',n.variation,0,50,1,'','node')}${input('Брак, %','defect',n.defect,0,35,.5,'','node')}${input('Доступность, %','availability',n.availability,40,100,1,'','node')}${input('Переналадка, сек','setup',n.setup,0,3600,1,'На каждую производственную партию','node')}`:`<div class="field full"><small>Склад и клиент — граничные узлы; их имена и положение можно редактировать.</small></div>`}</div><div class="divider"></div><div class="section-head" style="margin-bottom:8px"><h4 class="card-title">Связи объекта</h4><span class="pill">${inLinks.length} вход / ${outLinks.length} выход</span></div>${outLinks.map(e=>`<div class="report-line"><span>→ ${esc(nodeOf(state.model,e.to)?.name)}</span><button class="button sm ghost" data-action="remove-link" data-edge-key="${esc(edgeKey(e))}" aria-label="Удалить связь">✕</button></div>`).join('')}${!outLinks.length?'<p class="config-note">Исходящих связей нет.</p>':''}<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:18px">${btn('Связать с другим','link-from','soft sm',`data-id="${es function mapView(){const selectedNode=nodeOf(state.model,state.selected),selectedEdge=state.model.edges.find(e=>edgeKey(e)===state.edgeSelected);return `${headline('ВИЗУАЛЬНАЯ МОДЕЛЬ','Карта производственного потока','Перетаскивайте операции, настраивайте их длительность и соединяйте этапы. Соединения определяют зависимости подсборок при симуляции.','')}${changesWarn()}<div class="map-layout"><section class="card map-card"><div class="map-toolbar"><div class="map-tools">${btn(icon('plus')+' Операция','add-node','sm')}${btn(icon('flow')+(state.linkMode?' Завершить связь':' Соединить'),'link-mode',`sm ${state.linkMode?'soft':''}`)}${btn(icon('refresh')+' Авторазмещение','auto-layout','sm')}</div><div class="map-tools">${btn('−','zoom-out','sm')}${btn(Math.round(state.zoom*100)+'%','zoom-reset','sm')}${btn('+','zoom-in','sm')}</div></div>${state.linkMode?`<div class="notice warning" style="border:0;border-radius:0">${icon('flow')}${state.linkFrom?'Теперь выберите операцию-получатель.':'Сначала выберите источник, затем получатель. Циклические связи запрещены.'}</div>`:''}<div id="map-viewport" class="map-viewport"><div id="world-box" class="world-box" style="width:${1650*state.zoom}px;height:${640*state.zoom}px"><div id="map-world" class="map-world" style="width:1650px;height:640px;transform:scale(${state.zoom})"><svg id="edge-layer" class="edge-layer" viewBox="0 0 1650 640"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3L0 6" fill="none" stroke="#bdc8da" stroke-width="1.5"/></marker><marker id="arrow-focus" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3L0 6" fill="none" stroke="#5548de" stroke-width="1.6"/></marker></defs><g id="map-edges">${renderEdges()}</g></svg>${state.model.nodes.map(graphNode).join('')}</div></div></div><div class="map-bottom"><span>Узлы: <b>${state.model.nodes.length}</b> · Связи: <b>${state.model.edges.length}</b></span><span>Переместить: зажать и тянуть · Связь: режим «Соединить»</span></div></section>${selectedEdge?edgeInspector(selectedEdge):selectedNode?nodeInspector(selectedNode):`<section class="card inspector"><div class="empty">Выберите объект на карте для редактирования.</div></section>`}</div><div class="footer">Визуальная карта — упрощённый граф потока, а не сертифицированная VSM по ГОСТ. Масштаб расстояний условный и меняется в разделе «Параметры → Логистика».</div>`;}

wallet')}</div>${[['Отгружено изделий',r.accepted+' шт.'],['Затраты на материалы',rub(f.materialCost)],['Затраты на труд',rub(f.laborCost)],['Прочие расходы',rub(f.fixedCosts)],['Выручка',rub(f.revenue)],['Прибыль',rub(f.profit)],['НЗП (физический объём)',r.wip+' ед.']].map(([label,val])=>`<div class="report-line"><span>${label}</span><b>${val}</b></div>`).join('')}</section></div><div class="notice warning" style="margin-top:17px">${icon('alert')}Материалы рассчитываются по запущенным комплектам, а не по бухгалтерской оценке НЗП. Для корректной экономики потребуются реальные нормы расхода и стоимость деталей, ФОТ и правила учёта брака.</div>`;}
function recommendations(){const r=state.result,s=state.model.settings,op=r.bottleneck;let suggestions=[];if(op){const node=nodeOf(state.model,op.id);suggestions.push({title:'Снизить время загрузки проблемной операции',description:`«${node.name}» — рассчитанная загрузка ${fix(op.utilization)}%. Можно проверить гипотезу сокращения времени цикла на 15%. Эффект — только после повторной симуляции.`,act:'improve-op',label:'Проверить −15% цикла'});}if(s.transportBatch>1)suggestions.push({title:'Сократить размер транспортной партии',description:`Сейчас перевозка пакетами по ${s.transportBatch} ед. При переходе к единичной передаче уменьшается ожидание полной партии, но может увеличиться число рейсов.`,act:'reduce-transport',label:'Партия 1 изделие'});if(s.logistCount<5)suggestions.push({title:'Оценить дополнительный логистический ресурс',description:`Загрузка логистики ${fix(r.logistics.utilization)}%. Добавление работника увеличивает расходы, но может сократить очереди.`,act:'add-logist',label:'Добавить логиста'});if(s.handlingSeconds>=3)suggestions.push({title:'Оптимизировать погрузку/разгрузку',description:`Текущее условное время обработки рейса: ${s.handlingSeconds} с. Проверьте сокращение на 20% за счёт изменения организации рабочего места.`,act:'reduce-handling',label:'Сократить время рейса'});return `${headline('ОБЪЯСНИМАЯ АНАЛИТИКА','Проблемы и гипотезы улучшения','Рекомендации основаны на правилах и результатах симуляции — без внешней нейросети и без обещаний гарантированного эффекта.',btn(icon('play')+'Повторить диагностику','run','primary'))}${changesWarn()}<div class="grid overview-grid"><section class="card"><div class="section-head"><h2 class="card-title">Рекомендации для проверки</h2><span class="pill">${suggestions.length} гипотез</span></div>${suggestions.map((x,i)=>`<div class="insight-box"><div class="eyebrow" style="font-size:9px;margin:0 0 6px">ГИПОТЕЗА ${i+1}</div><h4>${esc(x.title)}</h4><p>${esc(x.description)}</p>${btn(x.label,x.act,'soft sm')}</div>`).join('')}<p class="config-note">Кнопки меняют параметры сценария, но не меняют реальное производство. После применения обязательно выполните расчёт и сравнение с исходной моделью.</p></section><section class="card"><div class="section-head"><h2 class="card-title">Автоматическая диагностика</h2><span class="pill amber">${r.issues.length} записей</span></div>${issueCards(r,20)}<div class="divider"></div><h3 class="card-title">Ограничения достоверности</h3><p class="card-sub">Время цикла и стоимость требуют фактических замеров, перемещения упрощены прямыми линиями, дефекты возникают с заданной вероятностью и не отправляются на доработку. Рекомендации — гипотезы для эксперта, а не автоматические распоряжения персоналу.</p></section></div>`;}

function downloadFile(content,name,type='application/json;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}

function modal(title,body,okLabel,onConfirm){const root=$('modal-root');root.innerHTML=`<div class="modal-mask"><div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${body}<div class="modal-actions"><button class="button" data-modal-cancel>Отмена</button><button class="button primary" data-modal-ok>${esc(okLabel)}</button></div></div></div>`;root.querySelector('[data-modal-cancel]').onclick=()=>{root.innerHTML='';};root.querySelector('.modal-mask').onclick=e=>{if(e.target.classList.contains('modal-mask'))root.innerHTML='';};root.querySelector('[data-modal-ok]').onclick=()=>{onConfirm(root);};root.querySelector('input')?.focus();}

function saveScenario(){modal('Сохранить сценарий',`<p>Название должно отражать смысл изменения, например «Ускорение 4-й операции».</p><div class="field"><label>Название сценария</label><input id="scenario-name" value="Сценарий ${state.scenarios.length+1}" maxlength="80"></div>`,'Сохранить',root=>{const name=root.querySelector('#scenario-name').value.trim();if(!name)return toast('Укажите название сценария');try{validate(state.model);}catch(e){return toast('Не удалось сохранить: '+e.message);}if(state.scenarios.length>=25)return toast('Максимум 25 сохранённых сценариев');const id='sc'+Date.now().toString(36)+'-'+Math.floor(Math.random()*900);state.scenarios.unshift({id,name,date:new Date().toLocaleDateString('ru-RU'),model:clone(state.model)});persist();modalClose();draw();toast('Сценарий сохранён локально');});}

function addNode(){const ids=state.model.nodes.filter(n=>/^o\d+$/.test(n.id)).map(n=>+n.id.slice(1));const no=Math.max(10,...ids)+1;if(state.model.nodes.length>=26)return toast('Лимит узлов достигнут');const id='o'+no;state.model.nodes.push({id,type:'operation',name:'Новая операция '+no,x:590,y:452,cycle:60,staff:1,variation:10,defect:0,availability:100,setup:0});state.selected=id;state.edgeSelected=null;dataChanged();toast('Операция добавлена. Соедините её с процессом для полноценной симуляции.');}
function deleteNode(id){const n=nodeOf(state.model,id);if(!n||n.type!=='operation')return;modal('Удалить операцию?',`<p>«${esc(n.name)}» и её связи будут удалены. Затем проверьте непрерывность потока.</p>`,'Удалить',()=>{state.model.nodes=state.model.nodes.filter(n=>n.id!==id);state.model.edges=state.model.edges.filter(e=>e.from!==id&&e.to!==id);state.selected='o1';modalClose();dataChanged();});}
function deleteEdge(key){const e=state.model.edges.find(e=>edgeKey(e)===key);if(!e)return;state.model.edges=state.model.edges.filter(x=>edgeKey(x)!==key);state.edgeSelected=null;dataChanged();toast('Связь удалена. Проверьте поток перед расчётом.');}
function linkNodes(a,b){if(!a||!b||a===b)return toast('Выберите два разных узла');if(state.model.edges.some(e=>e.from===a&&e.to===b))return toast('Такая связь уже есть');const model=clone(state.model);model.edges.push({from:a,to:b});try{const from=nodeOf(model,a),to=nodeOf(model,b);if(from.type==='customer'||to.type==='warehouse'||to.type==='customer'&&from.type!=='qc'||from.type==='qc'&&to.type!=='customer')throw Error('Недопустимое направление связи');if(model.edges.length>90)throw Error('Превышен лимит связей');const visited=new Set();function reach(x){if(x===a)return true;if(visited.has(x))return false;visited.add(x);return outgoing(model,x).some(e=>reach(e.to));}if(reach(b))throw Error('Эта связь создаст цикл');state.model.edges.push({from:a,to:b});state.selected=b;state.linkMode=false;state.linkFrom=null;dataChanged();toast('Связь добавлена');}catch(e){toast('Невозможно соединить: '+e.message);}}
function autoLayout(){// Reflow by dependency level; this changes the simulated distances and therefore transport times.
 const nodes=state.model.nodes,indeg=Object.fromEntries(nodes.map(n=>[n.id,0])),lvl=Object.fromEntries(nodes.map(n=>[n.id,0]));for(const e of state.model.edges)indeg[e.to]++;const queue=nodes.filter(n=>indeg[n.id]===0).map(n=>n.id);let visited=0;while(queue.length){const id=queue.shift();visited++;for(const e of outgoing(state.model,id)){lvl[e.to]=Math.max(lvl[e.to],lvl[id]+1);if(--indeg[e.to]===0)queue.push(e.to);}}if(visited!==nodes.length)return toast('Авторазмещение невозможно при циклических связях');let byLevel={};for(const n of nodes)(byLevel[lvl[n.id]]||=[]).push(n);const levels=Object.keys(byLevel).map(Number).sort((a,b)=>a-b);const max=Math.max(...levels);for(const l of levels){const group=byLevel[l];group.forEach((n,i)=>{n.x=Math.round(32+l*(1540/Math.max(1,max)));n.y=Math.max(22,Math.round(300-(group.length-1)*68+i*136));});}dataChanged();toast('Обновлено размещение; условные расстояния изменились');}
function graphPositionRefresh(){document.querySelectorAll('.graph-node[data-node]').forEach(el=>{const n=nodeOf(state.model,el.dataset.node);if(n){el.style.left=n.x+'px';el.style.top=n.y+'px';}});const el=$('map-edges');if(el)el.innerHTML=renderEdges();}
function changeInput(el){const scope=el.dataset.scope,key=el.dataset.key;if(!scope||!key)return;let val;if(el.type==='checkbox')val=el.checked;else if(el.type==='number'){val=Number(el.value);if(!Number.isFinite(val)||el.value.trim()===''){toast('Введите корректное число');draw();return;}}else val=el.value.trim();
 let dest=scope==='node'?nodeOf(state.model,state.selected):state.model.settings;if(!dest)return;
 if(scope==='setting'){
  if(key in LIMITS){const [lo,hi]=LIMITS[key];if(typeof val!=='number'||val<lo||val>hi){toast(`Параметр «${key}»: диапазон ${lo}–${hi}`);draw();return;}if(['target','releaseUnits','productionBatch','transportBatch','initialStock','initialFlowWip','logistCount','seed'].includes(key)&&!Number.isInteger(val)){toast('Введите целое число');draw();return;}}
 }else if(scope==='node'){
  if(key==='name'){if(!val||val.length>80){toast('Название: от 1 до 80 символов');draw();return;}}
  else {const ranges={cycle:[1,3600],staff:[1,8],variation:[0,50],defect:[0,35],availability:[40,100],setup:[0,3600]};if(ranges[key]&&(val<ranges[key][0]||val>ranges[key][1]||!Number.isFinite(val))){toast('Некорректное значение '+key);draw();return;}if(key==='staff'&&!Number.isInteger(val)){toast('Количество операторов должно быть целым');draw();return;}}
 }
 dest[key]=val;state.analysisNotice='';dataChanged();}
let drag=null,suppressClick=false;
document.addEventListener('pointerdown',e=>{const card=e.target.closest('.graph-node[data-node]');if(!card||state.linkMode||e.button!==0)return;if(e.target.closest('button,input,select,textarea'))return;const n=nodeOf(state.model,card.dataset.node);if(!n)return;drag={id:n.id,card,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y,moved:false};card.setPointerCapture?.(e.pointerId);e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!drag)return;const dist=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);if(dist>4)drag.moved=true;if(!drag.moved)return;const n=nodeOf(state.model,drag.id);if(!n)return;n.x=Math.max(0,Math.min(1650-nodeWidth(n)-5,Math.round(drag.x+(e.clientX-drag.sx)/state.zoom)));n.y=Math.max(0,Math.min(640-90,Math.round(drag.y+(e.clientY-drag.sy)/state.zoom)));drag.card.style.left=n.x+'px';drag.card.style.top=n.y+'px';const edgeEl=$('map-edges');if(edgeEl)edgeEl.innerHTML=renderEdges();});
document.addEventListener('pointerup',()=>{if(!drag)return;const id=drag.id,moved=drag.moved;drag=null;if(moved){suppressClick=true;state.selected=id;state.edgeSelected=null;dataChanged();}else{state.selected=id;state.edgeSelected=null;draw();}});
document.addEventListener('pointercancel',()=>{drag=null;});
document.addEventListener('click',e=>{
 if(suppressClick){suppressClick=false;if(e.target.closest('.graph-node'))return;}
 const nav=e.target.closest('[data-view]');if(nav){selectView(nav.dataset.view);return;}
 const link=e.target.closest('[data-edge]');if(link){state.edgeSelected=link.dataset.edge;state.selected=null;draw();return;}
 const nd=e.target.closest('.graph-node[data-node]');if(nd){const id=nd.dataset.node;if(state.linkMode){if(!state.linkFrom){state.linkFrom=id;draw();}else linkNodes(state.linkFrom,id);}else{state.selected=id;state.edgeSelected=null;draw();}return;}
 const action=e.target.closest('[data-action]');if(!action)return;const act=action.dataset.action;
 switch(act){
 case 'goto-map':selectView('map');break;case 'goto-simulation':selectView('simulation');break;case 'goto-insights':selectView('insights');break;case 'finance-settings':state.tab='finance';selectView('parameters');break;
 case 'run':runModel();break;case 'csv':downloadCSV();break;
 case 'export':try{validate(state.model);downloadFile(JSON.stringify({kind:'PROCESS_LAB_MODEL',version:3,exportedAt:new Date().toISOString(),model:state.model,scenarios:state.scenarios},null,2),'process_lab_model.json');toast('Модель экспортирована в JSON');}catch(err){toast('Исправьте модель перед экспортом: '+err.message);}break;
 case 'import':$('import-file').click();break;
 case 'settings-tab':state.tab=action.dataset.tab;draw();break;
 case 'zoom-out':state.zoom=Math.max(.55,+(state.zoom-.10).toFixed(2));draw();break;
 case 'zoom-in':state.zoom=Math.min(1.35,+(state.zoom+.1).toFixed(2));draw();break;
 case 'zoom-reset':state.zoom=.83;draw();break;
 case 'add-node':addNode();break;case 'auto-layout':autoLayout();break;
 case 'link-mode':state.linkMode=!state.linkMode;state.linkFrom=null;draw();break;
 case 'link-from':state.linkMode=true;state.linkFrom=action.dataset.id;draw();break;
 case 'delete-node':deleteNode(action.dataset.id);break;
 case 'remove-link':case 'delete-edge':deleteEdge(action.dataset.edgeKey);break;
 case 'inspect-node':state.selected=action.dataset.id;selectView('map');break;
 case 'save-scenario':saveScenario();break;case 'reset':restoreBase();break;
 case 'load-scenario':loadScenario(action.dataset.id);break;
 case 'delete-scenario':deleteScenario(action.dataset.id);break;
 case 'improve-op':{const n=nodeOf(state.model,state.result.bottleneck?.id);if(n){n.cycle=Math.max(1,+(.85*n.cycle).toFixed(1));state.selected=n.id;state.edgeSelected=null;dataChanged();toast('Гипотеза применена. Запустите симуляцию для проверки.');}break;}
 case 'reduce-transport':state.model.settings.transportBatch=1;dataChanged();toast('Партия изменена: 1 изделие. Пересчитайте модель.');break;
 case 'add-logist':state.model.settings.logistCount=Math.min(8,state.model.settings.logistCount+1);dataChanged();toast('Логист добавлен. Учтите увеличение затрат.');break;
 case 'reduce-handling':state.model.settings.handlingSeconds=+(state.model.settings.handlingSeconds*.8).toFixed(2);dataChanged();toast('Время обслуживания рейса сокращено на 20% в сценарии.');break;
 }
});
document.addEventListener('change',e=>{if(e.target.matches('[data-scope]'))changeInput(e.target);});
document.addEventListener('keydown',e=>{const node=e.target.closest('.graph-node[data-node]');if(node&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.selected=node.dataset.node;state.edgeSelected=null;draw();}if(e.key==='Escape'&&$('modal-root').children.length)modalClose();});
$('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>500000) return toast('JSON-файл слишком большой (максимум 500 КБ)');try{const value=JSON.parse(await file.text()),incomingModel=value.model||value;validate(incomingModel);state.model=clone(incomingModel);state.result=simulate(state.model);state.scenarios=Array.isArray(value.scenarios)?value.scenarios.filter(x=>x&&x.model&&x.name).slice(0,25):state.scenarios;state.dirty=false;state.selected='o1';state.edgeSelected=null;state.analysisNotice='';persist();draw();toast('Модель импортирована и проверена');}catch(err){toast('Не удалось импортировать модель: '+err.message);}});
// Expose a small read-only testing surface; not used by the application.
window.PROCESS_LAB_TEST={simulate,validate,getModel:()=>clone(state.model),getResult:()=>clone(state.result),getState:()=>({view:state.currentView,dirty:state.dirty})};
draw();
</script>
</body></html>
