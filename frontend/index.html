<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb"><meta name="description" content="PROCESS LAB — локальный цифровой двойник и конструктор потоков создания ценности">
<title>PROCESS LAB • Редактор КПСЦ и цифровой двойник</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden">
<symbol id="ico-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="ico-flow" viewBox="0 0 24 24"><rect x="2" y="8" width="6" height="7" rx="1.5"/><rect x="16" y="3" width="6" height="7" rx="1.5"/><rect x="16" y="14" width="6" height="7" rx="1.5"/><path d="M8 11.5h4M12 11.5V6.5h4M12 11.5v6h4"/></symbol>
<symbol id="ico-tune" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 3v8M16 13v8"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="17" r="2" fill="currentColor" stroke="none"/></symbol>
<symbol id="ico-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></symbol>
<symbol id="ico-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
<symbol id="ico-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 9V6a2 2 0 0 1 2-2h12M15 13h6M16 13v2"/></symbol>
<symbol id="ico-insight" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M7 15a7 7 0 1 1 10 0c-1.5 1.4-2 2-2 3H9c0-1-.5-1.6-2-3z"/></symbol>
<symbol id="ico-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
<symbol id="ico-download" viewBox="0 0 24 24"><path d="M12 3v13M7 11l5 5 5-5M4 18v3h16v-3"/></symbol>
<symbol id="ico-upload" viewBox="0 0 24 24"><path d="M12 17V4M7 9l5-5 5 5M4 17v4h16v-4"/></symbol>
<symbol id="ico-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="ico-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-5L4 8M4 3v5h5M4 13a8 8 0 0 0 14 5l2-2M20 21v-5h-5"/></symbol>
<symbol id="ico-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
<symbol id="ico-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 9v5M12 18v.2"/></symbol>
<symbol id="ico-store" viewBox="0 0 24 24"><path d="M3 10l2-6h14l2 6v11H3zM3 10h18M9 21v-7h6v7"/></symbol>
<symbol id="ico-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
<symbol id="ico-zoom" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L21 21"/></symbol>
</svg>
<div class="app">
 <aside class="sidebar">
  <div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18l6-7 4 4 8-10M15 5h6v6"/></svg></div><div><div class="brand-title">PROCESS LAB</div><div class="brand-sub">Digital Twin Studio</div></div></div>
  <div class="sidebar-label">Рабочее пространство</div>
  <nav id="side-nav" aria-label="Разделы приложения"></nav>
  <div class="sidebar-bottom"><div class="small-note"><svg><use href="#ico-alert"/></svg><span><b>Демонстрационная система</b><br>Исходные времена и финансовые данные требуют подтверждения заказчиком.</span></div></div>
 </aside>
 <main class="main">
  <header class="topbar"><div class="top-left"><div class="crumb">Рабочее пространство / <strong id="crumb">Обзор</strong></div></div>
  <div class="top-actions"><div class="demo-pill"><span class="demo-dot"></span>Локальная демо-модель</div><button class="button" data-action="import" title="Импорт модели JSON"><svg><use href="#ico-upload"/></svg>Импорт</button><button class="button" data-action="export" title="Экспорт модели JSON"><svg><use href="#ico-download"/></svg>Экспорт</button><button class="button primary" data-action="run"><svg><use href="#ico-play"/></svg>Симуляция</button></div></header>
  <section id="content" class="content" aria-live="polite"></section>
 </main>
</div>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<div id="modal-root"></div><div id="toast" class="toast" role="status"></div>
<script src="./app.js" defer></script>
<script src="./backend_sync.js" defer></script>
</body></html>
